<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* ===== High-Contrast Dining Location Button ===== */
.g-loc-chip-btn {
  display: inline-flex !important;
  align-items: center !important;
  gap: 8px !important;
  height: 36px !important;
  padding: 0 14px !important;
  border-radius: 999px !important;
  background: #152A20 !important;
  color: #FFFFFF !important;
  border: 1.5px solid #D4AF37 !important;
  font-size: 13px !important;
  font-weight: 700 !important;
  cursor: pointer !important;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25) !important;
  transition: all 0.2s ease !important;
}
.g-loc-chip-btn:hover {
  background: #1E4033 !important;
  border-color: #F59E0B !important;
  color: #FFFFFF !important;
  transform: translateY(-1px) !important;
}
.g-loc-chip-btn .loc-badge {
  background: #B45309 !important;
  color: #FFFFFF !important;
  font-size: 10.5px !important;
  font-weight: 800 !important;
  padding: 2px 7px !important;
  border-radius: 6px !important;
  text-transform: uppercase !important;
  letter-spacing: 0.5px !important;
}

</style>

  --veg:#3DBA66;--nonveg:#E0735F;--egg:#E2A93A;--danger:#F0675B;--danger-soft:#3A1B18;--ok:#4CC27E;--ok-soft:#173222;
  --warn:#F0A04B;--warn-soft:#352514;--info:#6FB2E3;--info-soft:#15293A;
  --p-urgent:#F0675B;--p-priority:#F0914B;--p-fast:#6FB2E3;--p-normal:#A9B8AF;--p-none:#6E7B73;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--teak);outline-offset:2px}
.num,.tab-nums{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;min-height:38px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.teak{background:var(--teak);border-color:var(--teak);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);flex:none}
.field{display:grid;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px}
textarea.input{min-height:70px;resize:vertical}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* veg / non-veg marks (FSSAI style square) */
.vmark{width:14px;height:14px;border:1.6px solid var(--veg);border-radius:2px;display:inline-grid;place-items:center;flex:none}
.vmark::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.vmark.nv{border-color:var(--nonveg)}
.vmark.nv::after{border-radius:0;width:0;height:0;background:none;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--nonveg)}
.vmark.egg{border-color:var(--egg)}.vmark.egg::after{background:var(--egg)}

/* =================== GUEST =================== */
.hero{position:relative;overflow:hidden;background:#1a241e;color:#fff;min-height:260px;display:flex;align-items:flex-end}
.hero video,.hero img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,14,.15) 0%,rgba(10,18,14,.35) 45%,rgba(10,18,14,.88) 100%)}
.hero-inner{position:relative;z-index:1;width:100%;padding-block:56px 22px}
.hero .kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,7vw,52px);line-height:1.04;margin-top:6px;letter-spacing:.01em}
.hero h1 small{display:block;font-size:.5em;opacity:.85;margin-top:4px}
.hero .cuisines{margin-top:10px;font-size:14px;opacity:.9;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero .loc-badge{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(6px);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.guest-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.guest-top .row{display:flex;gap:8px;align-items:center;padding-block:10px}
.search{flex:1;min-width:0;position:relative}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.veg-toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 10px;min-height:40px;background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap}
.veg-toggle input{accent-color:var(--veg);width:16px;height:16px}
.cat-rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.cat-rail::-webkit-scrollbar{display:none}
.menu-body{padding-block:18px 130px;display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
.menu-body>*{min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:14px}
.sec-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.5vw,32px);color:var(--pine)}
:root[data-theme="dark"] .sec-head h2{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec-head h2{color:var(--ink)}}
.sec-note{font-size:13px;color:var(--teak);font-weight:600}
.sub-head{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.sub-head:first-of-type{margin-top:0}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.dish{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0}
.dish.off{opacity:.55}
.thumb{width:92px;height:92px;flex:none;border-radius:8px;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-art{background:#FBF6EA;border-radius:50%}.thumb-art svg{width:100%;height:100%;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:rgba(255,255,255,.92);position:relative;overflow:hidden}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 6px,transparent 6px 14px)}
.ph span{position:relative}
.dish-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.dish-top{display:flex;gap:8px;align-items:flex-start}
.dish-top .vmark{margin-top:3px}
.dish h4{font-size:15.5px;font-weight:600;line-height:1.25}
.sig{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teak);background:var(--teak-soft);border-radius:4px;padding:2px 6px;margin-left:4px;vertical-align:2px}
.dish p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dish-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.add-btn{border:1px solid var(--pine);color:var(--pine);background:var(--surface);border-radius:8px;font-weight:700;font-size:13px;letter-spacing:.06em;padding:6px 16px;min-height:34px}
:root[data-theme="dark"] .add-btn{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .add-btn{color:var(--ink)}}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--pine);border-radius:8px;overflow:hidden;background:var(--pine);color:var(--pine-ink)}
.stepper button{width:34px;height:34px;border:0;background:transparent;color:inherit;font-size:18px;font-weight:700}
.stepper span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.sig-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,240px);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.sig-card{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.sig-card .thumb{width:100%;height:130px;border-radius:0}
.sig-card .b{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.sig-card h4{font-size:15px;font-weight:600}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.order-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.order-bar button{pointer-events:auto;max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--pine);color:var(--pine-ink);border:0;border-radius:12px;padding:14px 18px;box-shadow:0 10px 30px rgba(10,30,20,.3);font-weight:600}
.order-bar .count{background:rgba(255,255,255,.18);border-radius:6px;padding:2px 8px;margin-right:8px;font-variant-numeric:tabular-nums}
.foot-links{text-align:center;font-size:12.5px;color:var(--muted);padding-bottom:110px}
.foot-links button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px}

/* sheet / modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(8,14,11,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
@media (min-width:720px){.overlay{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:88%}}
.sheet.wide{max-width:980px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h3{font-family:var(--f-display);font-weight:400;font-size:24px}
.sheet-body{padding:16px 18px;overflow-y:auto;overflow-x:hidden;display:grid;gap:16px;min-height:0;box-sizing:border-box;max-width:100%}
.sheet-foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.cart-line{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.cart-line .nm{min-width:0;font-weight:600}
.cart-line .nm small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.cart-line .stepper{background:var(--surface);color:var(--ink);border-color:var(--line)}
.cart-line .stepper button{width:30px;height:30px}
.x-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--danger);font-size:16px;line-height:1;display:grid;place-items:center}
.x-btn:hover{background:var(--danger-soft);border-color:var(--danger)}
.bill{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.bill .r{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.bill .r span:first-child{color:var(--muted)}
.bill .total{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700;font-size:17px}
.bill .total span:first-child{color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--pine);color:var(--pine-ink)}
.loc-row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.loc-row .field{flex:1;min-width:120px}
.confirm-box{border:1.5px solid var(--teak);background:var(--teak-soft);border-radius:var(--r);padding:14px;display:grid;gap:6px}
.done-box{text-align:center;display:grid;gap:10px;padding:10px 0}
.ticket-code{font-family:var(--f-mono);font-size:28px;font-weight:600;letter-spacing:.06em}
.notice{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--info-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--info) 40%,transparent)}
.notice.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.notice.bad{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.track{display:grid;gap:12px}
.track-card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.track-card .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* =================== STAFF SHELL =================== */
.staff-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--pine);color:var(--pine-ink)}
.staff-top .row{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px;white-space:nowrap}
.brand small{display:block;font-size:11px;opacity:.75;letter-spacing:.1em;text-transform:uppercase}
.role-tabs{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;margin-left:auto}
.role-tabs button{border:0;background:transparent;color:inherit;opacity:.8;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px}
.role-tabs button[aria-current="page"]{background:#fff;color:#1E4033;opacity:1}
.top-actions{display:flex;gap:6px;align-items:center}
.top-actions .icon-btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff;position:relative}
.badge{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.mode-pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.14)}
.mode-pill.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#6EE7A0;margin-right:6px;vertical-align:1px}
.staff-main{padding-block:18px 60px;display:grid;gap:18px}
.page-title{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title h2{font-family:var(--f-display);font-weight:400;font-size:28px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teak)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}
.stat .s{font-size:12px;color:var(--muted)}
.board{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:980px){.board.has-detail{grid-template-columns:minmax(0,1fr) 440px}}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;width:100%}
.tbl::-webkit-scrollbar{height:8px}
.tbl::-webkit-scrollbar-track{background:var(--surface-2);border-radius:4px}
.tbl::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
.tbl::-webkit-scrollbar-thumb:hover{background:#94A3B8}
.tr{display:grid;grid-template-columns:145px 140px 110px minmax(240px,1fr) 120px 85px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);position:relative;min-width:880px}
.tr.th{border-top:0;background:var(--surface-2);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:11px;border-bottom:1px solid var(--line)}
.tr.row{cursor:pointer}
.tr.row:hover{background:var(--surface-2)}
.tr.row.sel{background:color-mix(in srgb,var(--teak) 10%,var(--surface))}
.tr.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,transparent)}
.tr.row.redo{box-shadow:inset 0 0 0 1.5px var(--danger)}
.code{font-family:var(--f-mono);font-weight:600;font-size:14px;white-space:nowrap;letter-spacing:-0.02em}
.loc{font-weight:700}
.loc small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.c-code{white-space:nowrap}
.c-pri{white-space:nowrap}
.c-st{white-space:nowrap}
.c-age{white-space:nowrap;text-align:right}
.items-sum{font-size:13.5px;min-width:0;overflow:hidden;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.prog{display:flex;gap:3px;margin-top:4px}
.prog i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.prog i.preparing{background:var(--warn)}.prog i.prepared{background:var(--info)}.prog i.ready{background:var(--teak)}.prog i.served{background:var(--ok)}.prog i.reprepare{background:var(--danger)}
.ppill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);color:var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--surface));white-space:nowrap}
.ppill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc)}
.p-urgent{--pc:var(--p-urgent)}.p-priority{--pc:var(--p-priority)}.p-fast{--pc:var(--p-fast)}.p-normal{--pc:var(--p-normal)}.p-none{--pc:var(--p-none)}
.st{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:3px 7px;white-space:nowrap}
.st.queued{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st.preparing{background:var(--warn-soft);color:var(--warn)}
.st.prepared{background:var(--info-soft);color:var(--info)}
.st.ready{background:var(--teak-soft);color:var(--teak)}
.st.served{background:var(--ok-soft);color:var(--ok)}
.st.reprepare{background:var(--danger);color:#fff}
.st.cancelled{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.st.completed{background:var(--ok-soft);color:var(--ok)}
.st.new{background:var(--pine);color:var(--pine-ink)}
.st.cooking{background:var(--warn-soft);color:var(--warn)}
.age{font-size:13px;font-variant-numeric:tabular-nums}
.age.late{color:var(--danger);font-weight:700}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
@media (min-width:980px){.detail{position:sticky;top:84px;max-height:calc(100vh - 100px)}}
@media (max-width:979px){.detail-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,14,11,.5);display:flex;align-items:flex-end}.detail-wrap .detail{width:100%;max-height:90%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.detail-head{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.detail-head .l1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.detail-head h3{font-size:20px;font-weight:700}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.detail-body{overflow-y:auto;padding:6px 16px 12px;min-height:0}
.dline{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.dline input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--pine)}
.dline .n{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.dline .n b{font-weight:600}
.dline .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.dline.redo{background:color-mix(in srgb,var(--danger) 7%,transparent);margin-inline:-16px;padding-inline:16px;border-left:4px solid var(--danger)}
.redo-flag{color:var(--danger);font-weight:800;font-size:12px;letter-spacing:.08em}
.bulk{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r);align-items:center}
.gnote{background:var(--warn-soft);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink)}
.serve-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.serve-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;border-top:4px solid var(--pc,var(--teak))}
.serve-card .h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.serve-card .h .loc{font-size:18px}
.serve-card ul{list-style:none;margin:0;padding:4px 12px 10px}
.serve-card li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.serve-card li:last-child{border-bottom:0}
.two-col{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1000px){.two-col{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px;align-content:start;min-width:0}
.panel h3{font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.feed{display:grid;gap:8px;max-height:420px;overflow-y:auto}
.feed-item{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.feed-item.reprepare{background:var(--danger-soft)}
.feed-item.serve{background:var(--teak-soft)}
.feed-item time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.olist{display:grid;gap:8px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px}
.orow select{max-width:150px}
.select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:34px;font-size:13.5px;font-weight:600}
/* CMS */
.cms-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cms-bar .search{min-width:200px}
.cms-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cms-row{display:grid;grid-template-columns:52px minmax(0,1fr) 110px 90px auto;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.cms-row:first-child{border-top:0}
.cms-row .thumb{width:52px;height:52px}
.cms-row .ph{font-size:20px}
.cms-row .nm{font-weight:600;min-width:0}
.cms-row .nm small{display:block;color:var(--muted);font-weight:400;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cms-group{padding:10px 14px;background:var(--surface-2);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.cms-group:first-child{border-top:0}
@media (max-width:640px){.cms-row{grid-template-columns:52px minmax(0,1fr) auto;grid-template-areas:"t n e" "t p a"}.cms-row .thumb{grid-area:t}.cms-row .nm{grid-area:n}.cms-row .pr{grid-area:p}.cms-row .av{grid-area:a;justify-self:end}.cms-row .ed{grid-area:e}}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.switch input{appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(16px)}
.form-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.photo-edit{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo-edit .thumb{width:120px;height:120px}
.rate-row{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:10px;align-items:end}
.pct{position:relative}.pct input{padding-right:28px}.pct::after{content:"%";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.qr-card{background:#fff;color:#15201A;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;justify-items:center;gap:6px;text-align:center}
.qr-card .qr{width:136px;height:136px}
.qr-card .qr img,.qr-card .qr canvas{width:136px!important;height:136px!important}
.qr-card b{font-family:var(--f-display);font-weight:400;font-size:18px}
.hist-row{display:grid;grid-template-columns:75px 145px minmax(200px,1fr) 115px 105px;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;min-width:680px}
.hist-row:hover{background:var(--surface-2)}
.hist-detail{padding:4px 14px 14px;border-top:1px dashed var(--line);display:grid;gap:10px;background:var(--surface-2)}
.gate{min-height:100%;display:grid;place-items:center;padding:40px 16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px;display:grid;gap:14px;box-shadow:var(--shadow);text-align:center}
.gate-card h2{font-family:var(--f-display);font-weight:400;font-size:26px}
.pin-dots{display:flex;gap:10px;justify-content:center}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--pine)}
.pin-dots i.on{background:var(--pine)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pinpad button{height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:20px;font-weight:600}
.toasts{position:fixed;right:16px;bottom:16px;z-index:80;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);font-size:14px;display:grid;gap:2px;animation:tin .25s ease-out}
.toast.reprepare{background:var(--danger);color:#fff}
.toast.serve{background:var(--teak);color:#fff}
.toast.new{background:var(--pine);color:#fff}
.toast b{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
@keyframes tin{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.composer{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:820px){.composer{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.pick-list{display:grid;gap:4px;max-height:48vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px}
.pick:hover{background:var(--surface-2)}
.pick .stepper{background:var(--surface);color:var(--ink);border-color:var(--line)}
.pick .stepper button{width:28px;height:28px}
.spacer{flex:1}
.hide-sm{}
@media (max-width:560px){.hide-sm{display:none!important}}

/* Printable Common Master QR Standee */
.printable-qr-standee {
  background: #FFFDF7;
  border: 2px solid #D6B66E;
  box-shadow: 0 10px 32px rgba(23,54,42,0.12);
  border-radius: 16px;
  padding: 34px 28px;
  max-width: 460px;
  width: 100%;
  box-sizing: border-box;
  text-align: center;
  position: relative;
  page-break-inside: avoid;
}
.printable-qr-standee::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(214,182,110,0.5);
  border-radius: 10px;
  pointer-events: none;
}
.standee-inner {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.standee-brand h2 {
  font-family: var(--f-script);
  font-weight: 700;
  font-size: 42px;
  color: #17362A;
  margin: 6px 0 0;
  line-height: 1;
}
.standee-brand .sub {
  font-family: var(--f-script);
  font-size: 22px;
  font-weight: 700;
  color: #8A7550;
  line-height: 1.1;
}
.orn-line {
  font-family: var(--f-fell);
  font-style: italic;
  font-size: 13.5px;
  color: #B48C46;
  letter-spacing: .08em;
  margin: 4px 0 6px;
}
.scan-title {
  font-family: var(--f-engr);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #17362A;
  background: #F4EEDC;
  border: 1px solid rgba(160,124,56,0.4);
  padding: 7px 18px;
  border-radius: 999px;
  display: inline-block;
}
.scan-desc {
  font-family: var(--f-fell);
  font-size: 14.5px;
  color: #5A4A32;
  margin: 6px 0 10px;
  max-width: 36ch;
  line-height: 1.35;
}
.qr-frame {
  background: #FFFFFF;
  padding: 16px;
  border-radius: 12px;
  border: 1.5px solid #E5D7B7;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  display: inline-flex;
  justify-content: center;
  align-items: center;
  margin: 4px 0 12px;
}
.qr-frame .qr canvas, .qr-frame .qr img {
  display: block;
  width: 250px;
  height: 250px;
}
.standee-instructions {
  font-size: 13.5px;
  color: #3E3423;
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 4px;
}
.standee-instructions b {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: #7A6542;
}
.loc-chips {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: #17362A;
  font-size: 14.5px;
}
.standee-foot {
  font-size: 12.5px;
  font-style: italic;
  color: #8A7550;
  margin-top: 4px;
}
.standee-url {
  font-family: var(--f-mono);
  font-size: 11px;
  color: #9A8A70;
  margin-top: 6px;
  letter-spacing: .02em;
}

@media print {
  @page { size: auto; margin: 12mm; }
  *, *::before, *::after { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body{background:#fff!important;color:#000!important}
  .staff-top, .tabs, .page-title, .stats, .no-print, .btn, .icon-btn, .cms-bar, .filters, #toasts{display:none!important}
  .wrap{max-width:100%!important;padding:0!important}

  /* Print support for Common QR Standee */
  .panel.qr-print-section {
    border: none !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
    display: flex !important;
    justify-content: center !important;
    align-items: center !important;
    min-height: 90vh !important;
    background: #fff !important;
  }
  .printable-qr-standee {
    box-shadow: none !important;
    border: 3.5px double #17362A !important;
    max-width: 480px !important;
    margin: auto !important;
    padding: 36px 28px !important;
    background: #FFFDF7 !important;
    page-break-inside: avoid !important;
  }
  .printable-qr-standee::before {
    border-color: #B48C46 !important;
  }
  .qr-frame {
    box-shadow: none !important;
    border: 1px solid #D6B66E !important;
    background: #fff !important;
  }
  .qr-frame .qr canvas, .qr-frame .qr img {
    width: 270px !important;
    height: 270px !important;
  }
}

/* =================== GUEST MENU BOOK (deliberately single-look: dark lodge backdrop, ivory paper) =================== */
.g-root img{-webkit-user-drag:none;user-select:none}
.g-root{position:fixed;inset:0;overflow:hidden;background:#0B1310;color:#2A2418;font-family:var(--f-body);color-scheme:light;touch-action:pan-y}
.g-bg{position:absolute;inset:0;overflow:hidden}
.g-bg video,.g-bg img{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);max-width:none;object-fit:cover;filter:blur(9px) brightness(.5) saturate(1.15)}
.g-bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 48%,rgba(10,18,14,.15),rgba(6,11,9,.82))}
.g-bar{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 6px;color:#EFE4C6}
.g-brand{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto}
.g-brand svg{flex:none}
.g-brand b{font-family:var(--f-script);font-weight:700;font-size:32px;line-height:1;letter-spacing:0;white-space:nowrap}
.g-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(239,228,198,.28);background:rgba(16,28,22,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#EFE4C6;font-size:13px;font-weight:600;white-space:nowrap}
button.g-chip{cursor:pointer}
button.g-chip[aria-pressed="true"]{background:#EFE4C6;color:#1B3127}
.g-chip .vmark{background:#fff}
.g-icon{width:36px;padding:0;justify-content:center}
.g-seg{display:inline-flex;height:36px;border-radius:999px;border:1px solid rgba(239,228,198,.28);background:rgba(16,28,22,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:2px;gap:2px}
.g-seg button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;color:#EFE4C6;font-size:13px;font-weight:600;padding:0 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.g-seg button[aria-pressed="true"]{background:#EFE4C6;color:#1B3127}
.g-seg .vmark{background:#fff;width:11px;height:11px}
@media (max-width:420px){.g-seg .vmark{display:none}.g-seg button{padding:0 9px}.g-brand b{display:none}}
.g-stage{position:absolute;left:0;right:0;display:grid;place-items:center;z-index:2}
.book{position:relative;perspective:2400px;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.book .pg{position:absolute;top:0;overflow:hidden}
.pg{background-color:#FBF6EA;background-image:radial-gradient(ellipse 90% 70% at 50% 45%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),var(--grain);box-shadow:0 18px 40px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.25)}
.pg.L{border-radius:6px 0 0 6px;box-shadow:-10px 18px 40px rgba(0,0,0,.45)}
.pg.R{border-radius:0 6px 6px 0}
.pg.S{border-radius:4px 8px 8px 4px}
.pg.L::after,.pg.R::after,.pg.S::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;z-index:3}
.pg.L::after{right:0;background:linear-gradient(90deg,rgba(80,60,30,0),rgba(80,60,30,.16) 70%,rgba(40,28,12,.32))}
.pg.R::after{left:0;background:linear-gradient(270deg,rgba(80,60,30,0),rgba(80,60,30,.14) 70%,rgba(40,28,12,.30))}
.pg.S::after{left:0;width:16px;background:linear-gradient(270deg,rgba(80,60,30,0),rgba(60,44,20,.22))}
.pg-frame{position:absolute;inset:11px;border:1px solid rgba(160,124,56,.55);border-radius:3px;pointer-events:none;z-index:1}
.pg-frame::before{content:"";position:absolute;inset:3px;border:.6px solid rgba(160,124,56,.35);border-radius:2px}
.pg-sk{position:absolute;left:16px;right:16px;top:16px;height:var(--headh,68px);background-size:cover;background-position:center 40%;opacity:.4;z-index:1;-webkit-mask-image:radial-gradient(ellipse 70% 100% at 50% 20%,#000 40%,transparent 95%);mask-image:radial-gradient(ellipse 70% 100% at 50% 20%,#000 40%,transparent 95%);pointer-events:none}
.pg-run{position:absolute;top:calc(16px + var(--headh,68px) - 10px);left:14px;right:14px;text-align:center;font-family:var(--f-engr);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9A7A3E;z-index:2;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;pointer-events:none;line-height:1.2}
.pg-run span{background:#FBF6EA;padding:2px 12px;border-radius:3px;box-shadow:0 0 10px 6px #FBF6EA;display:inline-block;max-width:92%;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
.pg-folio{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-family:var(--f-menu);font-style:italic;font-size:13px;color:#8A7550;z-index:2}
.pg-body{container-type:inline-size;position:absolute;left:var(--px,26px);right:var(--px,26px);top:var(--btop,48px);bottom:40px;display:flex;flex-direction:column;gap:var(--gap,12px);z-index:2;overflow:hidden}
.pg-blank{display:grid;place-items:center;height:100%;color:#B49C6A}

/* item row */
.mi{display:grid;grid-template-columns:var(--med,48px) minmax(0,1fr) auto;gap:8px;align-items:center}
.mi.off{opacity:.45}
.med{width:var(--med,48px);height:var(--med,48px);border-radius:50%;overflow:hidden;cursor:pointer;flex:none;border:0;padding:0;background:none;display:block}
.med svg,.med img{width:100%;height:100%;display:block;object-fit:cover}
.med img{border-radius:50%;box-shadow:inset 0 0 0 2px #fff}
.mi-main{min-width:0}
.mi-top{display:flex;align-items:baseline;gap:5px}
.mi-name{font-family:var(--f-menu);font-weight:600;font-size:16.5px;line-height:1.18;color:#1C2A21;background:none;border:0;padding:0;text-align:left;cursor:pointer;word-break:break-word}
.mi-top .vmark{width:11px;height:11px;border-width:1.3px;align-self:center;background:#fff;flex:none}
.mi-top .vmark::after{width:4.5px;height:4.5px}
.mi-top .vmark.nv::after{border-left-width:3px;border-right-width:3px;border-bottom-width:5px;width:0;height:0}
.lead{flex:1;min-width:8px;border-bottom:1.5px dotted rgba(120,96,52,.45);transform:translateY(-3px);align-self:flex-end;margin-bottom:3px}
.mi-price{font-family:var(--f-menu);font-weight:700;font-size:16.5px;color:#1C2A21;font-variant-numeric:lining-nums tabular-nums;white-space:nowrap;margin-left:auto}
.mi-sub{display:flex;align-items:center;gap:6px;margin-top:2px;min-height:26px}
.mi-desc{margin-top:2px;min-width:0;font-family:var(--f-fell);font-style:italic;font-size:13px;line-height:1.24;color:#6E5E42;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sig-tag{font-family:var(--f-engr);font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9A7A3E;border:1px solid rgba(154,122,62,.5);border-radius:3px;padding:1px 4px 0;white-space:nowrap;vertical-align:1px;margin-right:4px}
.qctl{flex:none;justify-self:end}
.q-add{width:30px;height:30px;border-radius:50%;border:1.5px solid #1E4033;background:#FBF6EA;color:#1E4033;font-size:19px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer;font-family:var(--f-body);font-weight:600}
.q-add:hover{background:#1E4033;color:#FBF6EA}
.q-step{display:inline-flex;align-items:center;height:30px;border-radius:999px;background:#1E4033;color:#FBF6EA;overflow:hidden}
.q-step button{width:30px;height:30px;border:0;background:none;color:inherit;font-size:17px;font-weight:700;padding:0;cursor:pointer}
.q-step span{min-width:16px;text-align:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.q-na{font-family:var(--f-menu);font-style:italic;font-size:13px;color:#9A7A3E}

/* section opener */
.so{text-align:center;display:grid;gap:5px;justify-items:center;padding-top:2px}
.so h2{font-family:var(--f-goth);font-weight:600;font-size:clamp(22px,5vw,29px);letter-spacing:.005em;line-height:1.08;color:#1E4033;margin:0}
.so .orn{color:#B08D4A}
.so .note{font-family:var(--f-script);font-weight:700;font-size:19px!important;line-height:1.15;color:#7A6542;max-width:32ch;margin:0}
.so-plates{display:flex;gap:8px;justify-content:center;margin-top:2px}
.so-plates .med{width:52px;height:52px}

  const prefix = `${yyyy}${mm}${dd}`;
  let maxSeq = 0;
  if (window.S && Array.isArray(window.S.orders)) {
    for (const ord of window.S.orders) {
      const c = ord && ord.code ? String(ord.code) : '';
      if (c.startsWith(prefix + '-')) {
        const num = parseInt(c.split('-')[1], 10);
        if (!isNaN(num) && num > maxSeq) maxSeq = num;
      }
    }
  }
  return `${prefix}-${String(maxSeq + 1).padStart(3, '0')}`;

  if(l.type === 'villa') {
    const vName = /^villa|^cottage/i.test(num) ? num : 'Villa ' + num;

function computeBill(lines, settings){
  const subtotal = r2(lines.reduce((s,l)=>s+l.price*l.qty,0));
  const taxes=(settings.taxes||[]).map(t=>({name:t.name,rate:+t.rate||0,amount:r2(subtotal*(+t.rate||0)/100)}));
  const charges=(settings.charges||[]).map(t=>({name:t.name,rate:+t.rate||0,amount:r2(subtotal*(+t.rate||0)/100)}));
  const total=r2(subtotal+taxes.reduce((s,t)=>s+t.amount,0)+charges.reduce((s,t)=>s+t.amount,0));
  return {subtotal,taxes,charges,total};
}

function makeLocalStore(){

  let data = ls.get(KEY,null);
  if(!data){data={menu:{},orders:{},alerts:{},settings:{billing:DEFAULT_SETTINGS}};DEFAULT_MENU.forEach(m=>data.menu[m.id]=m);}
  const subs=[];
  const save=()=>{ls.set(KEY,data);emit();};
  function emit(){subs.forEach(s=>s.fire());}
  window.addEventListener('storage',e=>{if(e.key===KEY){data=ls.get(KEY,data);emit();}});
  function split(p){const a=p.split('/');return [a[0],a[1]];}
  return {
    mode:'local', writable:true,
    watchColl(name,opts,cb){const s={fire(){let arr=Object.entries(data[name]||{}).map(([id,v])=>({id,...v}));if(opts&&opts.order){const [f,d]=opts.order;arr.sort((a,b)=>(a[f]>b[f]?1:-1)*(d==='desc'?-1:1));}if(opts&&opts.limit)arr=arr.slice(0,opts.limit);cb(arr);}};subs.push(s);setTimeout(()=>s.fire());return ()=>{subs.splice(subs.indexOf(s),1);};},
    watchDoc(path,cb){const [c,id]=split(path);const s={fire(){const v=(data[c]||{})[id];cb(v?{id,...v}:null);}};subs.push(s);setTimeout(()=>s.fire());return ()=>{subs.splice(subs.indexOf(s),1);};},
    async set(path,v){const [c,id]=split(path);(data[c]=data[c]||{})[id]=JSON.parse(JSON.stringify(v));save();},
    async update(path,v){const [c,id]=split(path);if(!(data[c]||{})[id])throw {code:'invalid_argument'};Object.assign(data[c][id],JSON.parse(JSON.stringify(v)));save();},
    async del(path){const [c,id]=split(path);if(data[c])delete data[c][id];save();},
  };
}
function makeLiveStore(db){
  const strip=v=>JSON.parse(JSON.stringify(v));
  return {
    mode:'live', writable:true,
    watchColl(name,opts,cb,onErr){let q=db.collection(name);if(opts&&opts.order)q=q.orderBy(opts.order[0],opts.order[1]);if(opts&&opts.limit)q=q.limit(opts.limit);return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{console.warn('db',name,e);onErr&&onErr(e);});},
    watchDoc(path,cb){return db.doc(path).onSnapshot(s=>cb(s.exists?{id:s.id,...s.data()}:null),e=>console.warn('db',path,e));},
    set(path,v){return db.doc(path).set(strip(v));},
    update(path,v){return db.doc(path).update(strip(v));},
    del(path){return db.doc(path).delete();},
  };
}

async function write(fn){
  try{await fn();return true;}

function guessArt(it){
  const n=(it.name||'').toLowerCase();
  if(ART_MAP[n])return ART_MAP[n];
  const s=(it.sub||'').toLowerCase(), sec=(it.section||'').toLowerCase();
  if(/naan|roti|paratha|kulcha/.test(n))return['bread','naan'];
  if(/biryani/.test(n))return['rice','biryani'];
  if(/rice|pulao/.test(n))return['rice','plain'];
  if(/noodle/.test(n))return['noodles','veg'];
  if(/dal/.test(n))return['dal','#C98B2E','tadka'];
  if(/chai|tea|coffee/.test(n))return['drink','chai'];
  if(/juice|lassi|shake/.test(n))return['drink','juice'];
  if(/salad/.test(n))return['salad','green'];
  if(/raita|curd/.test(n))return['raita','plain'];
  if(/dessert/.test(sec)||/halwa|kheer|jamun|cake|ice/.test(n))return['dessert','kheer'];
  if(/beverage/.test(s))return['drink','tea'];
  if(/starter/.test(s))return it.veg?['dry','paneertikka']:['dry','tikka'];
  return['curry',it.veg?'#D9822F':'#9A3B1B',it.veg?'paneer':'chicken','copper'];
}

/* ---- sizing & pagination ---- */
function computeDims(){
  const W=G.vw||window.innerWidth,H=G.vh||window.innerHeight;
  const top=52, nav=46, bottom=54;
  const availW=W-16, availH=Math.max(320,H-top-nav-bottom-6);
  const mode = S.bookMode || ls.get('pe_book_mode', 'spread');
  let spread = false;
  if (mode === 'single') {
    spread = false;
  } else if (mode === 'spread') {
    // Open book mode: enable 2-page spread whenever width allows (>= 540px)
    spread = (availW >= 540);
  } else {
    // Auto: 2-page spread on screens >= 640px wide and >= 300px height
    spread = (W >= 640 && availH >= 300);
  }
  let pw,ph;
  if(spread){
    ph=Math.min(availH,860);
    pw=Math.min(ph*0.68,(availW)/2);
    ph=Math.min(ph,pw/0.6);
  } else {
    // Aspect ratio 1:1.45 matching reference photo
    const maxPh = Math.min(availH, 680);
    pw = Math.min(availW, Math.round(maxPh / 1.45));
    if (pw > 480) pw = 480;
    ph = Math.min(availH, Math.round(pw * 1.45));
    pw = Math.round(ph / 1.45);
  }
  pw=Math.floor(pw);ph=Math.floor(ph);
  const px = pw<380 ? 20 : 26;
  const med = pw<360 ? 44 : 48;
  const headH = ph<520 ? 44 : (pw<380 ? 58 : (spread ? 68 : 64));
  const btop = 16 + headH + 16;
  const innerH = ph - btop - 40;
  const feastBig = Math.round(Math.max(80,Math.min(220,innerH-300)));
  const feastSm = innerH<430;
  return {W,H,top,nav,bottom,spread,pw,ph,px,med,headH,btop,feastBig,feastSm,gap:pw<380?10:12,innerW:pw-2*px,innerH};
}
function measureBox(d){
  let m=document.getElementById('measure');
  if(!m){m=document.createElement('div');m.id='measure';document.body.appendChild(m);}
  m.className='pg';
  m.style.cssText=`position:fixed;left:-9999px;top:0;width:${d.pw}px;height:${d.ph}px;visibility:hidden;--btop:${d.btop}px;--headh:${d.headH}px;--px:${d.px}px;--med:${d.med}px;--gap:${d.gap}px;--sigmed:${d.pw<380?64:76}px`;
  return m;
}
function paginate(){
  const d=G.dims;
  const m=measureBox(d);
  const fits=(html)=>{m.innerHTML=`<div class="pg-body">${html}</div>`;const b=m.firstChild;return b.scrollHeight<=b.clientHeight+1;};
  const heightOf=(html)=>{m.innerHTML=`<div class="pg-body" style="bottom:auto">${html}</div>`;return m.firstChild.getBoundingClientRect().height;};
  G.noPhoto={};
  const fitsPage=(fn)=>{m.innerHTML=`<div class="pg-body">${fn()}</div>`;const b=m.firstChild;return b.scrollHeight<=b.clientHeight+1;};
  G.secOrder=new Array(9).fill('x');G.secPage={};
  const pages=[{t:'cover'},{t:'welcome'},{t:'contents'}];
  // signatures page: as many as fit
  const sigAll=sortedMenu().filter(m=>m.signature&&guestVisible(m));
  G.sigPage=null;
  if(sigAll.length){let n=Math.min(8,sigAll.length);if(n%2&&n>1)n--;while(n>1&&!fits(sigsHTML(sigAll.slice(0,n))))n-=2;pages.push({t:'sigs',list:sigAll.slice(0,Math.max(1,n))});G.sigPage=pages.length-1;}
  const cap=d.innerH;
  const G_=d.gap;
  const hcache={};
  const H=(b,key)=>{if(hcache[key]==null)hcache[key]=heightOf(blockHTML(b));return hcache[key];};
  G.secPage={};G.itemPage={};G.secOrder=[];
  sections().forEach(sec=>{
    const subs=sec.subs.map(sb=>({...sb,items:sb.items.filter(guestVisible)})).filter(sb=>sb.items.length);
    if(!subs.length)return;
    const all=subs.flatMap(s=>s.items);
    const blocks=[];
    const thali=sec.name==='Pahari Dham'?all.find(i=>/thali/i.test(i.name)):null;
    if(thali)blocks.push({t:'feast',it:thali,key:'feast'+thali.id});
    else blocks.push({t:'open',sec:sec.name,items:all.filter(i=>i.signature).concat(all.filter(i=>!i.signature)),key:'open'+sec.name});
    subs.forEach(sb=>{if(sb.name)blocks.push({t:'sub',name:sb.name,key:'sub'+sb.name});sb.items.forEach(it=>{if(thali&&it.id===thali.id)return;blocks.push({t:'item',it,key:'it'+it.id});});});
    let cur=null,used=0;
    const newPage=()=>{cur={t:'content',run:sec.name,blocks:[]};pages.push(cur);used=0;};
    newPage();G.secPage[sec.name]=pages.length-1;G.secOrder.push(sec.name);
    for(let i=0;i<blocks.length;i++){
      const b=blocks[i];const h=H(b,b.key);
      let need=h+(cur.blocks.length?G_:0);
      // keep headings with their next item
      if((b.t==='sub'||b.t==='open'||b.t==='feast')&&blocks[i+1]&&blocks[i+1].t==='item')need+=G_+H(blocks[i+1],blocks[i+1].key);
      if(cur.blocks.length&&used+need>cap){newPage();}
      cur.blocks.push(b);used+=h+(cur.blocks.length>1?G_:0);
      if(b.t==='item'&&G.itemPage[b.it.id]==null)G.itemPage[b.it.id]=pages.length-1;
      if(b.t==='feast')G.itemPage[b.it.id]=pages.length-1;
    }
  });
  pages.push({t:'back'});
  G.pages=pages;
  G.tight={};
  [['welcome',welcomeHTML],['contents',contentsHTML],['back',backHTML]].forEach(([k,fn])=>{
    if(fitsPage(fn))return; G.noPhoto[k]=true; if(fitsPage(fn))return;
    G.tight[k]=1; if(fitsPage(fn))return; G.tight[k]=2; });
  m.innerHTML='';
}

function flipTo(target){

  if(target===G.idx)return;

  if(RM()){G.idx=target;renderBook();return;}
  const my=++flipSeq; G.animating=true; G.dest=target;
  let leafHTML,staticHTML,leafStyle,frames,dur;
  if(G.spread){
    const [cl,cr]=spreadPages(G.idx),[tl,tr]=spreadPages(target);
    if(fwd){

      leafHTML=`<div class="face front">${pageDiv(cr,'R','left:0')}<div class="shade"></div></div><div class="face back">${pageDiv(tl,'L','left:0')}<div class="shade"></div></div>`;

    } else {

      frames=[{transform:'rotateY(-100deg)',opacity:0},{transform:'rotateY(-70deg)',opacity:1,offset:.3},{transform:'rotateY(0deg)',opacity:1}];}

function getHostForLocation(loc){
  if (!loc) return null;
  const locType = (loc.type || 'villa').toLowerCase();
  const locNum = String(loc.num || '').trim().toUpperCase();
  let villaNum = (loc.villa || '').trim();

  if (locType === 'villa') {
    villaNum = locNum;
  } else if (!villaNum) {
    const found = (S.locations || []).find(l => l.type === locType && String(l.number).toUpperCase() === locNum);
    if (found && found.parentVilla) villaNum = found.parentVilla;
  }

  const villa = (S.locations || []).find(l => l.type === 'villa' && String(l.number).toUpperCase() === (villaNum || 'VILLA 1').toUpperCase());
  if (villa && villa.assignedStaffName) {
    return {
      villaName: villa.number || 'Villa',
      name: villa.assignedStaffName,
      phone: villa.assignedStaffPhone || '9816012345',
      role: villa.assignedStaffRole || 'Villa Butler & Host'
    };
  }

  const fallback = (S.locations || []).find(l => l.type === 'villa' && l.assignedStaffName);
  if (fallback) {
    return {
      villaName: fallback.number || 'Villa',
      name: fallback.assignedStaffName,
      phone: fallback.assignedStaffPhone || '9816012345',
      role: fallback.assignedStaffRole || 'Villa Butler & Host'

  }

  return {
    villaName: 'Pines Exotica',

    phone: '9816012345',
    role: 'Resort Services'
  };
}

async function placeOrder(){
  const lines=cartLines(); if(!lines.length)return;
  const bill=computeBill(lines,S.settings);
  const curVilla = (S.loc && S.loc.villa) || S.locVillaSelected || 'Villa 1';
  const loc = {
    type: S.loc?.type || 'villa',
    num: String(S.loc?.num || '').trim(),
    villa: (S.loc?.type === 'villa') ? String(S.loc?.num || '').trim() : curVilla
  };
  const guestName = (S.guestName || '').trim();
  const guestPhone = (S.guestPhone || '').replace(/\D/g, '').slice(0, 10);
  if(!guestName || guestName.length < 2){
    toast('Name required', 'Please enter your name to place the order', 'reprepare');
    return;
  }
  if(guestPhone.length !== 10){
    toast('Phone required', 'Please enter your 10-digit mobile number', 'reprepare');
    return;
  }
  if(!loc.num){
    toast('Location required', `Please select your ${loc.type} before placing the order`, 'reprepare');
    return;
  }
  const code=codeGen();
  if(!(S.mode==='live'&&S.writable)){
    S.sheet={kind:'cart',step:'ticket',code,loc,guestName,guestPhone,lines,bill,note:S.cartNote};render();return;
  }
  const id='o'+Date.now().toString(36)+uid(4);
  const now=Date.now();
  const hasRaw = lines.some(l => l.isRawMaterial);
  const hasSrv = lines.some(l => l.isService);
  const orderType = hasRaw ? 'raw_material' : (hasSrv ? 'extra_service' : 'alacarte');
  const cookingCharge = lines.reduce((s,l)=> s + (l.isRawMaterial ? l.price*l.qty : 0), 0);
  const rawItem = lines.find(l => l.isRawMaterial);
  const paxCount = rawItem && rawItem.paxCount ? rawItem.paxCount : null;
  const rawMaterialSource = rawItem && rawItem.rawMaterialSource ? rawItem.rawMaterialSource : 'guest';
  const rawMaterialNotes = rawItem && rawItem.rawMaterialNotes ? rawItem.rawMaterialNotes : (rawMaterialSource === 'resort' ? 'Chef to procure fresh from local market on actuals' : 'Guest bringing raw ingredients');

  const order={
    code,
    loc,
    guestName,
    guestPhone,
    source:'guest',
    priority:'normal',
    status:'open',
    createdAt:now,
    updatedAt:now,
    note:S.cartNote||'',
    orderType,
    rawMaterialCost: 0,
    cookingCharge,
    paxCount,
    rawMaterialSource,
    rawMaterialNotes,
    items:lines.map(l=>({
      k:uid(6),
      id:l.id,
      name:l.name,
      price:l.price,
      qty:l.qty,
      veg:!!l.veg,
      status:'queued',
      redo:0,
      isRawMaterial: !!l.isRawMaterial,
      isService: !!l.isService,
      cookingCharge: l.cookingCharge || 0,
      paxSlab: l.paxSlab || null,
      paxCount: l.paxCount || null,
      rawMaterialSource: l.rawMaterialSource || null
    })),
    bill
  };
  const ok=await write(()=>S.store.set('orders/'+id,order));
  if(!ok)return;
  pushAlert({kind:'new',orderId:id,code,loc,text:`New ${hasRaw?'cook-to-order ':''}order by ${guestName}: ${lines.length} dish${lines.length>1?'es':''}`});
  S.myOrders=[id,...S.myOrders].slice(0,10);ls.set('pe_my_orders',S.myOrders);
  S.cart={}; S.cartMeta={}; saveCart(); S.cartNote='';
  S.sheet={kind:'cart',step:'done',code,loc,guestName,guestPhone,total:bill.total};render();
}

/* ---------- orders logic ---------- */
function orderStage(o){
  if(o.status==='cancelled')return 'cancelled';
  const its=o.items||[];
  if(its.length&&its.every(i=>i.status==='served'))return 'completed';
  if(its.some(i=>i.status==='reprepare'))return 'redo';
  if(its.some(i=>i.status==='ready'))return 'ready';
  if(its.some(i=>i.status!=='queued'))return 'cooking';
  return 'new';
}
const STAGE_L={new:'New',cooking:'In kitchen',ready:'Ready to serve',redo:'Re-prepare',completed:'Completed',cancelled:'Cancelled'};
const STAGE_C={new:'new',cooking:'cooking',ready:'ready',redo:'reprepare',completed:'completed',cancelled:'cancelled'};
function activeOrders(){return S.orders.filter(o=>o.status==='open');}
function sortForKitchen(arr){return arr.slice().sort((a,b)=>{const pa=(PRI_BY[a.priority]||PRI_BY.normal).rank,pb=(PRI_BY[b.priority]||PRI_BY.normal).rank;if(pa!==pb)return pa-pb;return a.createdAt-b.createdAt;});}
function ppill(k){const p=PRI_BY[k]||PRI_BY.normal;return `<span class="ppill p-${p.k}">${p.l}</span>`;}
const ownAlerts=new Set();
async function pushAlert(a){const id='a'+Date.now().toString(36)+uid(4);ownAlerts.add(id);await write(()=>S.store.set('alerts/'+id,{...a,at:Date.now()}));}
async function mutateOrder(o, fn, alerts){
  const items=(o.items||[]).map(i=>({...i}));
  const patch=fn(items)||{};
  if(typeof alerts==='function')alerts=alerts();
  const now=Date.now();
  const allServed=items.length&&items.every(i=>i.status==='served');
  const upd={items,updatedAt:now,...patch};
  if(o.status==='open'&&allServed&&!patch.status){upd.status='completed';upd.completedAt=now;}
  const ok=await write(()=>S.store.update('orders/'+o.id,upd));
  if(ok&&alerts)for(const a of alerts)await pushAlert({orderId:o.id,code:o.code,loc:o.loc,...a});
}
function setItemStatus(orderId, keys, status){
  const o=S.orders.find(x=>x.id===orderId);if(!o)return;
  const names=[];
  mutateOrder(o, items=>{items.forEach(i=>{if(keys.includes(i.k)){ if(status==='reprepare'){i.redo=(i.redo||0)+1;} i.status=status; i.t=Date.now(); names.push(i.qty+'× '+i.name);} });},
    ()=>status==='ready'?[{kind:'serve',text:'Serve now: '+names.join(', ')}]
    :status==='reprepare'?[{kind:'reprepare',text:'RE-PREPARE: '+names.join(', ')}]:null);
}

async function composerSend(){
  const c=S.composer;
  const lines=Object.entries(c.cart).map(([id,q])=>{const m=menuById(id);return m&&q>0?{id,name:m.name,price:+m.price,qty:q,veg:!!m.veg}:null;}).filter(Boolean);
  const bill=computeBill(lines,S.settings);const id='o'+Date.now().toString(36)+uid(4);const code=codeGen();const now=Date.now();
  const loc={type:c.loc.type,num:String(c.loc.num).trim().toUpperCase()};
  const ok=await write(()=>S.store.set('orders/'+id,{code,loc,source:'waiter',priority:c.priority,status:'open',createdAt:now,updatedAt:now,note:c.note||'',items:lines.map(l=>({k:uid(6),...l,status:'queued',redo:0})),bill}));
  if(!ok)return;
  await pushAlert({kind:'new',orderId:id,code,loc,text:`New ${PRI_BY[c.priority].l.toLowerCase()} order from waiter`});
  S.composer=null;toast('Sent to kitchen',`${locLabel(loc)} · #${code}`,'new');render();
}

function drawQRs(){
  if(!window.QRCode){
    setTimeout(drawQRs, 250);
    return;
  }
  document.querySelectorAll('[data-qr]').forEach(el=>{if(el.dataset.done)return;el.dataset.done='1';try{new QRCode(el,{text:el.dataset.qr,width:272,height:272,colorDark:'#15201A',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.M});}catch(e){el.textContent='QR unavailable';}});
}

/* ---------- toasts & sound ---------- */
let audioCtx=null;
function chime(kind){
  if(!S.soundOn)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;
    const notes=kind==='reprepare'?[660,440,660]:kind==='serve'?[784,1047]:[880];
    notes.forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(0.0001,t+i*.16);g.gain.exponentialRampToValueAtTime(0.25,t+i*.16+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.16+.15);o.connect(g).connect(audioCtx.destination);o.start(t+i*.16);o.stop(t+i*.16+.16);});}catch(e){}
}
function toast(title,text,kind){
  const el=document.createElement('div');el.className='toast '+(kind||'');el.innerHTML=`<b>${esc(title)}</b><span>${esc(text)}</span>`;
  $('#toasts').appendChild(el);setTimeout(()=>el.remove(),kind==='reprepare'?9000:5500);
}
function showAlertToast(a){
  if(S.route==='guest'||!S.staffUnlocked)return;
  const title=a.kind==='reprepare'?'Re-prepare':a.kind==='serve'?'Ready to serve':'New order';
  toast(`${title} · ${locLabel(a.loc)}`,a.text+'  #'+a.code,a.kind);chime(a.kind);
}

function resizeImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const max=480;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',0.74));};img.onerror=rej;img.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

/* =================== EVENTS =================== */
document.addEventListener('click',async e=>{
  if(G.suppressClick&&e.target.closest('#g-stage')){G.suppressClick=false;return;}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act, id=t.dataset.id;
  // overlays close only on backdrop click
  if(a.startsWith('overlay-close')||a==='detail-bg'){ if(e.target!==t)return; }
  switch(a){
    case 'add': S.cart[id]=(S.cart[id]||0)+1; saveCart(); break;
    case 'dec': {
      S.cart[id]=Math.max(0,(S.cart[id]||0)-1);
      if(!S.cart[id]){ delete S.cart[id]; if(S.cartMeta) delete S.cartMeta[id]; }
      saveCart();
      if(S.sheet&&S.sheet.step==='confirm')S.sheet.step='review';
      break;
    }
    case 'remove': {
      delete S.cart[id];
      if(S.cartMeta) delete S.cartMeta[id];
      saveCart();
      if(S.sheet)S.sheet.step='review';
      break;
    }
    case 'pick-raw-source': {
      const itId = t.dataset.item;
      const src = t.dataset.src;
      if (!S.rawChoice) S.rawChoice = {};
      if (!S.rawChoice[itId]) S.rawChoice[itId] = { source: 'guest', slabId: (S.cookingSlabs?.[0]?.id || 1) };
      S.rawChoice[itId].source = src;
      render();
      return;
    }
    case 'pick-raw-slab': {
      const itId = t.dataset.item;
      const slabId = parseInt(t.dataset.slab, 10);
      if (!S.rawChoice) S.rawChoice = {};
      if (!S.rawChoice[itId]) S.rawChoice[itId] = { source: 'guest', slabId };
      S.rawChoice[itId].slabId = slabId;
      render();
      return;
    }
    case 'add-raw-request': {
      const itemId = t.dataset.id || id;
      const slabs = (S.cookingSlabs && S.cookingSlabs.length) ? S.cookingSlabs.filter(s=>s.isActive!==false) : DEFAULT_SLABS;
      const choice = (S.rawChoice && S.rawChoice[itemId]) || { source: 'guest', slabId: slabs[0]?.id || 1 };
      const slab = slabs.find(s => s.id === choice.slabId) || slabs[0];
      S.cart[itemId] = 1;
      if (!S.cartMeta) S.cartMeta = {};
      S.cartMeta[itemId] = {
        paxSlab: slab,
        paxCount: slab ? slab.maxPax : 5,
        rawMaterialSource: choice.source,
        customPrice: slab ? slab.price : 2000
      };
      saveCart();
      S.sheet = null;
      toast('Added to Order', (slab ? slab.label : 'Custom Cooking Request') + ' · ' + inr(slab ? slab.price : 2000), 'new');
      render();
      return;
    }
    case 'clear-search': S.q=''; S.diet='all'; break;
    case 'flip-next': flipTo(curIdx()+1); return;
    case 'flip-prev': flipTo(curIdx()-1); return;
    case 'goto': gotoPage(+t.dataset.p); return;
    case 'find': S.sheet=null; render(); setTimeout(()=>gotoPage(+t.dataset.p),60); return;
    case 'open-item': S.sheet={kind:'item',id}; break;
    case 'open-search': S.sheet={kind:'search'}; setTimeout(()=>document.getElementById('g-search')?.focus(),30); break;
    case 'diet': S.diet=t.dataset.v; break;
    case 'jump': {const el=document.getElementById(t.dataset.to);if(el){const y=el.getBoundingClientRect().top+window.scrollY-($('.guest-top')?.offsetHeight||0)-8;window.scrollTo({top:y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}return;}
    case 'jump-raw': {
      const p = G.secPage["Chef's Custom Kitchen & Raw Material"];
      if(p != null) gotoPage(p);
      else toast('Custom Cooking', 'Browse towards the end of the menu', 'serve');
      return;
    }
    case 'toggle-spread': {
      const currentSpread = G.spread;
      S.bookMode = currentSpread ? 'single' : 'spread';
      ls.set('pe_book_mode', S.bookMode);
      G.sig = '';
      const curPage = G.spread ? spreadPages(G.idx)[1] : G.idx;
      G.keepPage = curPage;
      toast('Book Layout', S.bookMode === 'spread' ? '📖 Two Pages (Open Book Mode)' : '📄 Single Page Mode', 'serve');
      render();
      return;
    }
    case 'open-loc':
    case 'open-loc-modal':
      S.sheet = { kind: 'location' };
      render();
      setTimeout(() => document.getElementById('sheet-guest-name')?.focus(), 50);
      return;
    case 'pick-villa':
      S.locVillaSelected = t.dataset.v;
      if (S.loc && S.loc.type !== 'villa') S.loc.num = '';
      render();
      return;
    case 'pick-loc-type':
      S.loc = { type: t.dataset.v, num: '', villa: S.locVillaSelected || (S.loc && S.loc.villa) || '' };
      render();
      return;
    case 'quick-loc': {
      const vNum = t.dataset.v;
      const villa = t.dataset.villa || S.locVillaSelected || (S.loc && S.loc.villa) || '';
      if(!S.loc) S.loc = { type: 'villa', num: '', villa };
      S.loc.num = vNum;
      S.loc.villa = villa;
      setGuestLocation(S.loc.type, S.loc.num, S.loc.villa);
      const nameEl = document.getElementById('sheet-guest-name');
      const phoneEl = document.getElementById('sheet-guest-phone');
      if (nameEl && nameEl.value.trim()) {
        S.guestName = nameEl.value.trim();
        ls.set('pe_guest_name', S.guestName);

      if (phoneEl && phoneEl.value.trim()) {
        S.guestPhone = phoneEl.value.trim();
        ls.set('pe_guest_phone', S.guestPhone);
      }
      S.sheet = null;
      toast('Location Confirmed', `${locLabel(S.loc)} confirmed!`, 'serve');
      render();
      return;
    }
    case 'save-loc-sheet': {
      const selEl = document.getElementById('loc-sheet-select');
      const nameEl = document.getElementById('sheet-guest-name');
      const phoneEl = document.getElementById('sheet-guest-phone');
      if (nameEl && nameEl.value.trim()) {
        S.guestName = nameEl.value.trim();
        ls.set('pe_guest_name', S.guestName);
      }
      if (phoneEl && phoneEl.value.trim()) {
        S.guestPhone = phoneEl.value.trim();
        ls.set('pe_guest_phone', S.guestPhone);
      }
      const val = selEl && selEl.value ? selEl.value.trim() : (S.loc?.num || '');
      const villa = S.locVillaSelected || (S.loc && S.loc.villa) || '';
      if (val) {
        setGuestLocation(S.loc?.type || 'villa', val, villa);
      }
      S.sheet = null;
      toast('Details Saved', `Welcome, ${S.guestName || 'Guest'}!`, 'serve');
      render();
      return;
    }
    case 'open-cart': {
      S.sheet = { kind: 'cart', step: 'review' };
      const allV = getLocationOptions('villa');
      const defV = (S.loc && S.loc.villa) || (S.loc && S.loc.type === 'villa' ? S.loc.num : '') || (allV[0] ? allV[0].number : 'Villa 1');
      if (!S.locVillaSelected) S.locVillaSelected = defV;
      if (!S.locDestType) S.locDestType = (S.loc && S.loc.type) || 'room';
      break;
    }
    case 'open-track': S.sheet={kind:'track'}; break;
    case 'close-sheet': case 'overlay-close': S.sheet=null; break;
    case 'cart-confirm': {
      const phoneClean = (S.guestPhone || '').replace(/\D/g, '');
      if (!S.guestName || S.guestName.trim().length < 2) {
        toast('Name required', 'Please enter your full name', 'reprepare');
        return;
      }
      if (phoneClean.length !== 10) {
        toast('Phone required', 'Please enter 10-digit mobile number', 'reprepare');
        return;
      }
      if (!S.loc || !S.loc.num) {
        const curType = S.locDestType || (S.loc && S.loc.type) || 'room';
        toast('Location required', `Please select your ${curType.toUpperCase()}`, 'reprepare');
        return;
      }
      S.sheet.step = 'confirm';
      break;
    }
    case 'confirm-add-more': {
      S.sheet = null;
      toast('Cart Saved', 'Add more dishes from the menu anytime!', 'serve');
      break;
    }
    case 'confirm-place-order':
    case 'place': {
      t.disabled = true;
      await placeOrder();
      return;
    }
    case 'cart-back': S.sheet.step='review'; break;
    case 'cart-pick-villa': {
      const selV = t.dataset.v;
      S.locVillaSelected = selV;
      const curT = S.locDestType || (S.loc && S.loc.type) || 'room';
      if (curT === 'villa') {

      S.locDestType = newType;
      const curVilla = S.locVillaSelected || (S.loc && S.loc.villa) || 'Villa 1';
      if (newType === 'villa') {
        setGuestLocation('villa', curVilla, curVilla);
      } else {
        const opts = getLocationOptions(newType, curVilla);
        const match = opts.find(l => String(l.number).toUpperCase() === String(S.loc?.num || '').toUpperCase());
        setGuestLocation(newType, match ? match.number : '', curVilla);
      }
      updateCartValidation();
      render();
      break;
    }
    case 'cart-quick-loc': {
      const curVilla = t.dataset.villa || S.locVillaSelected || (S.loc && S.loc.villa) || 'Villa 1';
      const curType = S.locDestType || (S.loc && S.loc.type) || 'room';

    case 'go': if(t.dataset.to==='guest')go('guest');else go(t.dataset.to); return;
    case 'pin': if(S.pin.length<4){S.pin+=t.dataset.v;S.pinErr=false;} if(S.pin.length===4){ if(S.pin===String(S.settings.pin||'1234')){S.staffUnlocked=true;ss.set('pe_staff','1');} else S.pinErr=true; S.pin=''; } break;

    case 'pick': {const bs=S.board[t.dataset.role];const arr=new Set(bs.picks[t.dataset.order]||[]);t.checked?arr.add(t.dataset.k):arr.delete(t.dataset.k);bs.picks[t.dataset.order]=[...arr];break;}
    case 'pick-all': {const bs=S.board[t.dataset.role];const o=S.orders.find(x=>x.id===t.dataset.order);const cur=bs.picks[o.id]||[];bs.picks[o.id]=cur.length===o.items.length?[]:o.items.map(i=>i.k);break;}

    case 'compose': S.composer={cart:{},loc:{type:'room',num:''},priority:'normal',note:'',q:''}; break;

    case 'c-dec': S.composer.cart[id]=Math.max(0,(S.composer.cart[id]||0)-1); S.composer.confirm=false; break;
    case 'c-rm': delete S.composer.cart[id]; S.composer.confirm=false; break;
    case 'c-loc': S.composer.loc.type=t.dataset.v; break;
    case 'c-confirm': S.composer.confirm=true; break;
    case 'c-back': S.composer.confirm=false; break;
    case 'c-send': t.disabled=true; await composerSend(); return;
    case 'atab': S.adminTab=t.dataset.v; S.taxDraft=null;S.chargeDraft=null;S.accessDraft=null; break;
    case 'otab': S.ordersTab=t.dataset.v; break;
    case 'hist-open': S.histOpen=S.histOpen===id?null:id; break;
    case 'avail': {const m=menuById(id);if(m)await write(()=>S.store.set('menu/'+id,{...stripId(m),available:t.checked}));break;}
    case 'cms-edit': {const m=menuById(id);S.cms.edit={...m};S.cms.confirmDel=false;S.cms.err='';break;}
    case 'cms-new': S.cms.edit={_new:true,id:'',name:'',section:S.cms.section!=='all'?S.cms.section:'',sub:'',desc:'',price:'',veg:true,egg:false,signature:false,available:true,img:''};S.cms.err='';break;
    case 'cms-close': case 'overlay-close-cms': S.cms.edit=null; break;
    case 'cms-rmphoto': S.cms.edit.img=''; break;
    case 'e-flag': S.cms.edit[t.dataset.f]=t.checked; break;
    case 'cms-del': S.cms.confirmDel=true; break;
    case 'cms-del-no': S.cms.confirmDel=false; break;
    case 'cms-del-yes': {const e2=S.cms.edit;if(await write(()=>S.store.del('menu/'+e2.id))){toast('Dish deleted',e2.name,'');S.cms.edit=null;}break;}
    case 'cms-save': await saveDish(); break;
    case 'rate-add': {const k=t.dataset.kind==='taxes'?'taxDraft':'chargeDraft';S[k].push({name:t.dataset.kind==='taxes'?'New tax':'Service charge',rate:0});break;}
    case 'rate-rm': {const k=t.dataset.kind==='taxes'?'taxDraft':'chargeDraft';S[k].splice(+t.dataset.i,1);break;}
    case 'rate-reset': S[t.dataset.kind==='taxes'?'taxDraft':'chargeDraft']=null; break;
    case 'rate-save': {const kind=t.dataset.kind;const k=kind==='taxes'?'taxDraft':'chargeDraft';const clean=S[k].map(x=>({name:String(x.name||'').trim()||'Unnamed',rate:Math.max(0,Math.min(100,+x.rate||0))}));
      if(await write(()=>S.store.set('settings/billing',{...S.settings,[kind]:clean}))){S.settings={...S.settings,[kind]:clean};S[k]=null;toast('Saved',(kind==='taxes'?'Tax':'Service charge')+' rates now apply to new orders','');}break;}
    case 'acc-reset': S.accessDraft=null; break;
    case 'acc-save': {const d=S.accessDraft;if(await write(()=>S.store.set('settings/billing',{...S.settings,...d}))){S.settings={...S.settings,...d};S.accessDraft=null;toast('Saved','Menu link, locations and PIN updated','');}break;}
    case 'copy': {const v=t.dataset.v;try{await navigator.clipboard.writeText(v);toast('Copied',v,'');}catch(err){toast('Copy not available','Select the link text and copy it manually.','');}return;}
    case 'print-common-qr': window.print(); return;
    case 'download-common-qr': {
      const qrEl = document.querySelector('#common-master-qr canvas') || document.querySelector('#common-master-qr img');
      if (qrEl) {
        let url = qrEl.src;
        if (!url && qrEl.toDataURL) url = qrEl.toDataURL('image/png');
        if (url) {
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Pines-Exotica-Common-QR.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          toast('Downloaded', 'Common Menu QR code saved', '');
        }
      } else {
        toast('Not ready', 'QR code is still rendering', 'bad');
      }
      return;
    }
    default: return;
  }
  render();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}
  if(S.route==='guest'&&!S.sheet&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')){if(e.key==='ArrowRight'){flipTo(curIdx()+1);return;}if(e.key==='ArrowLeft'){flipTo(curIdx()-1);return;}}
  if(e.key==='Escape'){if(S.sheet){S.sheet=null;render();}else if(S.composer){S.composer=null;render();}else if(S.cms.edit){S.cms.edit=null;render();}else if(S.feedOpen){S.feedOpen=false;render();}}
});
function stripId(m){const {id,_new,...rest}=m;return rest;}
async function saveDish(){
  const e=S.cms.edit;const name=String(e.name||'').trim();const price=+e.price;
  if(!name){S.cms.err='Give the dish a name.';return;}
  if(!(price>=0)||e.price===''){S.cms.err='Enter a price in rupees.';return;}
  const section=String(e.section||'').trim()||'Chef’s Specials';
  let id=e.id;
  if(e._new){id=(section.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,14)+'-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,30)+'-'+uid(4)).replace(/^-+|-+$/g,'');}
  const inSec=S.menu.filter(m=>m.section===section);
  const order=e._new?(inSec.length?Math.max(...inSec.map(m=>m.order||0))+1:(Math.max(0,...S.menu.map(m=>m.order||0))+100)):e.order;
  const doc={name,section,sub:String(e.sub||'').trim(),desc:String(e.desc||'').trim(),price,veg:!!e.veg,egg:!!e.egg,signature:!!e.signature,available:e.available!==false,img:e.img||'',order};
  if(await write(()=>S.store.set('menu/'+id,doc))){toast('Saved',name+' · '+inr(price),'');S.cms.edit=null;}
}
document.addEventListener('input',e=>{
  const t=e.target;const k=t.dataset.input;if(!k)return;
  if(k==='q'){S.q=t.value;render();}
  else if(k==='cartNote'){S.cartNote=t.value;}
  else if(k==='cart-guest-name'){S.guestName=t.value;ls.set('pe_guest_name',S.guestName);updateCartValidation();}
  else if(k==='cart-guest-phone'){const cl=t.value.replace(/\D/g,'').slice(0,10);t.value=cl;S.guestPhone=cl;ls.set('pe_guest_phone',S.guestPhone);updateCartValidation();}
  else if(k==='cart-loc-select'){
    const curVilla = S.locVillaSelected || (S.loc && S.loc.villa) || 'Villa 1';
    const curType = S.locDestType || (S.loc && S.loc.type) || 'room';
    setGuestLocation(curType, t.value, curVilla);
    updateCartValidation();
  }
  else if(k==='sheet-loc-select'){if(!S.loc)S.loc={type:'villa',num:''};S.loc.num=t.value;render();}
  else if(k==='pick-raw-slab-select'){
    const itId = t.dataset.item;
    const slabId = parseInt(t.value, 10);
    if (!S.rawChoice) S.rawChoice = {};
    if (!S.rawChoice[itId]) S.rawChoice[itId] = { source: 'guest', slabId };
    S.rawChoice[itId].slabId = slabId;
    render();
  }
  else if(k==='sheet-locnum'){if(!S.loc)S.loc={type:'villa',num:''};S.loc.num=t.value.replace(/[^A-Za-z0-9-]/g,'').slice(0,8);}
  else if(k==='locnum'){const num=t.value.replace(/[^A-Za-z0-9-]/g,'').slice(0,8); setGuestLocation(S.loc?.type||'table', num); render(); }
  else if(k==='cq'){S.composer.q=t.value;render();}
  else if(k==='cnum'){S.composer.loc.num=t.value.replace(/[^A-Za-z0-9-]/g,'').slice(0,8);S.composer.confirm=false;render();}
  else if(k==='cnote'){S.composer.note=t.value;}
  else if(k==='cmsq'){S.cms.q=t.value;render();}
  else if(k.startsWith('e.')){S.cms.edit[k.slice(2)]=t.value;}
  else if(k==='rate'){const d=S[t.dataset.kind==='taxes'?'taxDraft':'chargeDraft'];d[+t.dataset.i][t.dataset.f]=t.dataset.f==='rate'?(t.value===''?'':+t.value):t.value;render();}
  else if(k==='acc'){S.accessDraft[t.dataset.f]=t.dataset.f==='pin'?t.value.replace(/\D/g,'').slice(0,4):t.value;clearTimeout(window.__accT);window.__accT=setTimeout(render,t.dataset.f==='menuLink'||t.dataset.f==='rooms'||t.dataset.f==='tables'?500:0);}
});
document.addEventListener('change',async e=>{
  const t=e.target;const k=t.dataset.change;if(!k)return;
  if(k==='cart-loc-select'){
    const curVilla = S.locVillaSelected || (S.loc && S.loc.villa) || 'Villa 1';
    const curType = S.locDestType || (S.loc && S.loc.type) || 'room';
    setGuestLocation(curType, t.value, curVilla);
    updateCartValidation();
  }
  else if(k==='sheet-loc-select'){if(!S.loc)S.loc={type:'villa',num:''};S.loc.num=t.value;render();}
  else if(k==='pick-raw-slab-select'){
    const itId = t.dataset.item;
    const slabId = parseInt(t.value, 10);
    if (!S.rawChoice) S.rawChoice = {};
    if (!S.rawChoice[itId]) S.rawChoice[itId] = { source: 'guest', slabId };
    S.rawChoice[itId].slabId = slabId;
    render();
    return;
  }
  if(k==='priority'){const o=S.orders.find(x=>x.id===t.dataset.order);if(o&&o.priority!==t.value){await write(()=>S.store.update('orders/'+o.id,{priority:t.value,updatedAt:Date.now()}));await pushAlert({kind:'priority',orderId:o.id,code:o.code,loc:o.loc,text:'Priority set to '+PRI_BY[t.value].l});}}
  else if(k==='cpri'){S.composer.priority=t.value;S.composer.confirm=false;}
  else if(k==='hdate'){S.histDate=t.value||dayKey(Date.now());S.histOpen=null;}
  else if(k==='cmssec'){S.cms.section=t.value;}
  else if(k==='ediet'){S.cms.edit.veg=t.value==='veg';S.cms.edit.egg=t.value==='egg';}
  else if(k==='photo'){const f=t.files&&t.files[0];if(!f)return;try{S.cms.edit.img=await resizeImage(f);S.cms.err='';}catch(err){S.cms.err='That file could not be read as an image. Try a JPG or PNG.';}}
  render();
});
// refresh waiting times without re-writing anything
setInterval(()=>{document.querySelectorAll('[data-age]').forEach(el=>{const ts=+el.dataset.age;el.textContent=ago(ts);el.classList.toggle('late',(Date.now()-ts)>1800000);});},30000);

boot();
})();
</script>
